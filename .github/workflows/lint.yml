name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-syntax:
    # Real gate: every .py file must parse. If this fails the container
    # would be broken.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile-check every .py file
        run: |
          python -m py_compile pipeline/*.py precache_antsxnet.py
          echo "All Python files parse cleanly"

  def-file-check:
    # Verify the container build recipe has the sections we expect.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Def-file sanity check
        run: |
          for section in "Bootstrap:" "%post" "%environment" "%runscript" "%help"; do
              if ! grep -q "$section" enigma-lesion.def; then
                  echo "ERROR: enigma-lesion.def missing $section"
                  exit 1
              fi
          done
          echo "enigma-lesion.def structure OK"

  ruff-informational:
    # Style check is INFORMATIONAL — reports issues but doesn't fail the
    # build. The pipeline scripts predate this repo and haven't been
    # retrofitted to modern style. Fix them incrementally.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check (informational only)
        run: ruff check pipeline/ precache_antsxnet.py || true

  shellcheck:
    # Shellcheck is informational too — shell scripts have some deliberate
    # sourcing patterns shellcheck flags.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: shellcheck --severity=warning pipeline/*.sh enigma-lesion.def || true
